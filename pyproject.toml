[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "move-money"
version = "0.1.0"
description = "A small, exact-cent money transfer library"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["move_money*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
